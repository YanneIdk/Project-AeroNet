<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="page_title">国银 — 门户首页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Portrait Main Wrapper -->
  <div class="aero-main-window" id="main-window">
    
    <!-- Title Bar -->
    <header class="window-titlebar">
      <div class="window-title">
        <img src="assets/globe.png" alt="" class="title-icon">
        <span data-i18n="window_header">国银日海会集团综合门户</span>
      </div>
      
      <div class="window-controls">
        <select id="lang-switcher" aria-label="Language">
          <option value="zh" selected>简体中文</option>
          <option value="ja">日本語</option>
          <option value="en">English</option>
        </select>
        <button class="win-btn close" title="Close">✕</button>
      </div>
    </header>

    <!-- Navigation Bar -->
    <nav class="glossy-navbar">
      <ul>
        <li><a href="index.html" class="active" data-i18n="nav_home">首页</a></li>
        <li><a href="rihaihui.html" data-i18n="nav_rihaihui">国银日海会集团</a></li>
        <li><a href="#media" id="nav-media-link" data-i18n="nav_media">媒体与下载中心</a></li>
        <li><a href="#solutions" id="nav-solutions-link" data-i18n="nav_solutions">企业解决方案</a></li>
        <li><a href="#about" id="nav-about-link" data-i18n="nav_about">企业愿景</a></li>
      </ul>
    </nav>

    <!-- Main Content Area -->
    <main class="window-body">
      
      <!-- Hero Banner -->
      <section class="hero-banner">
        <div class="hero-overlay">
          <h1 data-i18n="hero_title">连接未来的数字生态系统</h1>
          <p data-i18n="hero_subtitle">无缝云端协同、清晰高效的沟通体验与绿色可持续创新。</p>
          <button class="aqua-pill-btn" id="explore-btn" data-i18n="hero_cta">探索服务 »</button>
        </div>
      </section>

      <!-- Sub-Windows Grid -->
      <div class="sub-windows-grid">
        
        <!-- === ARTICLE BLOCK START === -->
        <article class="aero-subwindow">
          <div class="subwindow-header">
            <span data-i18n="card1_title">最新企业公告</span>
          </div>
          <div class="subwindow-content">
            <ul class="news-list">
              <li><span class="badge-new">NEW</span> <span data-i18n="news_1">第四季度全球基础设施升级圆满完成</span></li>
              <li><span data-i18n="news_2">全新发布国银桌面客户端 3.0</span></li>
              <li><span data-i18n="news_3">绿色数据中心计划达成 100% 环保目标</span></li>
            </ul>
          </div>
        </article>
        <!-- === ARTICLE BLOCK END === -->

        <!-- === ARTICLE BLOCK START === -->
        <article class="aero-subwindow">
          <div class="subwindow-header">
            <span data-i18n="card2_title">快捷资源下载</span>
          </div>
          <div class="subwindow-content icon-grid">
            <div class="skeuo-icon-item" id="dl-brochure-btn" style="cursor: pointer;">
              <div class="glossy-box blue">PDF</div>
              <span data-i18n="dl_brochure">企业宣传册</span>
            </div>
            <div class="skeuo-icon-item" id="dl-player-btn" style="cursor: pointer;">
              <div class="glossy-box green">EXE</div>
              <span data-i18n="dl_client">媒体播放器</span>
            </div>
          </div>
        </article>
        <!-- === ARTICLE BLOCK END === -->

      </div>
    </main>

    <!-- Status Bar Footer -->
    <footer class="window-statusbar">
      <span data-i18n="status_ready">就绪 | 已连接至国银安全服务器</span>
      <button id="glass-toggle-btn" class="glass-toggle-pill">透明</button>
    </footer>

  </div>

  <!-- Windows 7 Style Popup Dialog Container -->
  <div id="win7-dialog-overlay" class="win7-dialog-overlay hidden">
    <div class="win7-dialog">
      <div class="win7-dialog-titlebar">
        <span id="win7-dialog-title">国银提示</span>
        <button id="win7-dialog-close" class="win-btn close">✕</button>
      </div>
      <div class="win7-dialog-body">
        <div class="win7-dialog-icon">ℹ</div>
        <div class="win7-dialog-message" id="win7-dialog-text">Popup content goes here.</div>
      </div>
      <div class="win7-dialog-footer">
        <button id="win7-dialog-ok" class="aqua-pill-btn">确定</button>
      </div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
